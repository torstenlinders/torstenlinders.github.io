{{ define "main" }}
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-text">
        <h1>{{ .Title }}</h1>

        <div class="intro">
          {{ .Content }}
        </div>

        <div class="hero-actions">

          {{ with site.GetPage "/politik" }}
            <a class="button" href="{{ .RelPermalink }}">
              {{ i18n "read_politics" }}
            </a>
          {{ end }}

          {{ with site.GetPage "/rosta" }}
            <a class="button button-primary" href="{{ .RelPermalink }}">
              {{ i18n "how_to_vote" }}
            </a>
          {{ end }}

          {{ with site.GetPage "/test" }}
            <a class="button" href="{{ .RelPermalink }}">
              {{ i18n "take_test" }}
            </a>
          {{ end }}

        </div>
      </div>
    </div>
  </section>
